<!-- favourites.page.html -->
<!-- Shows all the movies the user has saved to their favourites list -->
<!-- Uses ion-card for consistent styling across the app -->
<!-- https://ionicframework.com/docs/api/card -->
<!-- https://developer.mozilla.org/en-US/docs/Web/API/Window/localStorage -->

<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goToHome()">
        <ion-icon name="home"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Favourite Movies</ion-title>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon name="heart"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

  <!-- message shown if the user hasnt added any favourites yet -->
  <!-- ngIf only shows this if the favourites array is empty -->
  <!-- https://angular.dev/guide/directives -->
  <div *ngIf="favourites.length === 0"
       style="padding: 32px 16px; text-align:center; color:#555;">
    <p style="font-size:18px;">No favourites added yet!</p>
    <p style="font-size:15px;">Go back to the home page and add some movies.</p>
  </div>

  <!-- looping through the favourites array showing each movie as a card -->
  <!-- https://ionicframework.com/docs/api/card -->
  <ion-card *ngFor="let movie of favourites"
            style="margin: 8px;">

    <!-- movie poster taking up full card width -->
    <img [src]="getImageUrl(movie.poster_path)"
         style="width:100%; height:300px; object-fit:cover;">

    <ion-card-content style="padding: 8px 12px;">

      <!-- details button navigates to the movie details page -->
      <ion-button (click)="goToMovieDetails(movie)"
          style="--background: #CAD3C1; --color: #333; --border-radius: 30px;">
        DETAILS
      </ion-button>

    </ion-card-content>

  </ion-card>

</ion-content>
