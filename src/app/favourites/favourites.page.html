<!-- favourites.page.html -->
<!-- Shows all the movies the user has saved to their favourites list -->
<!-- https://developer.mozilla.org/en-US/docs/Web/API/Window/localStorage -->

<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goToHome()">
        <ion-icon name="home"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Favourite Movies</ion-title>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon name="heart"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

  <!-- shown if no favourites have been added yet -->
  <!-- https://angular.dev/guide/directives -->
  <div *ngIf="favourites.length === 0"
       style="padding: 32px 16px; text-align:center; color:#555;">
    <p style="font-size:18px;">No favourites added yet!</p>
    <p style="font-size:15px;">Go back to the home page and add some movies.</p>
  </div>

  <div *ngFor="let movie of favourites" style="margin: 8px;">
<!--overflow:hidden clips the image to those corners -->
<!-- https://www.w3schools.com/css/css_overflow.asp -->
    <div style="width:350px; border-radius:8px; overflow:hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
<!-- object-fit:cover fills the container without stretching the image -->
<!-- display:block removes the small gap browsers add under inline images -->
<!-- https://developer.mozilla.org/en-US/docs/Web/CSS/object-fit -->
      <img [src]="getImageUrl(movie.poster_path)"
           style="width:100%; height:400px; object-fit:cover; display:block;">

      <div style="padding: 8px; background:white;">
        <p style="font-size:16px; font-weight:bold; margin:0 0 8px 0;">{{ movie.title }}</p>
        <ion-button (click)="goToMovieDetails(movie)"
            style="--background: #CAD3C1; --color: #333; --border-radius: 30px;">
          DETAILS
        </ion-button>
      </div>

    </div>

  </div>

</ion-content>
