<!-- movie-details.page.html -->
<!-- Shows the details of a selected movie including cast and crew -->
<!-- Using ion-card for a consistent look across the app -->
<!-- https://ionicframework.com/docs/api/card -->
<!-- https://css-tricks.com/snippets/css/a-guide-to-flexbox/ -->

<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goToHome()">
        <ion-icon name="home"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Movie Details</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="goToFavourites()">
        <ion-icon name="heart"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

  <!-- movie overview passed in from the home page -->
  <p style="padding: 16px; font-size: 16px; line-height: 1.6; color:#333;">
    {{ overview }}
  </p>

  <!-- add or remove from favourites button -->
  <!-- text changes depending on whether the movie is already a favourite -->
  <!-- https://angular.dev/guide/directives -->
  <ion-button expand="full" (click)="toggleFavourite()"
      style="--background: #CAD3C1; --color: #333; --border-radius: 30px; margin: 8px 16px;">
    {{ isFavourite ? 'Remove From Favourites' : 'Add To Favourites' }}
  </ion-button>

  <!-- cast section -->
  <h2 style="padding: 10px 16px; font-size: 20px; font-weight: bold;">Cast</h2>

  <!-- looping through cast array showing each member as a card -->
  <!-- clicking a card navigates to that persons details page -->
  <!-- https://ionicframework.com/docs/api/card -->
  <!-- https://angular.dev/guide/directives -->
  <ion-card *ngFor="let member of cast" (click)="goToDetails(member.id)">
    <div style="display:flex; align-items:center; padding:8px;">

      <img [src]="getImageUrl(member.profile_path)"
           style="width:80px; height:100px; object-fit:cover; flex-shrink:0; border-radius:4px;">

      <ion-card-content style="padding: 0 0 0 12px;">
        <!-- cast members name and character they play -->
        <p style="margin:0; font-weight:bold; font-size:16px;">{{ member.name }}</p>
        <p style="margin:4px 0 0 0; font-size:14px; color:#555;">{{ member.character }}</p>
      </ion-card-content>

    </div>
  </ion-card>

  <!-- crew section -->
  <h2 style="padding: 10px 16px; font-size: 20px; font-weight: bold;">Crew</h2>

  <!-- looping through crew array showing each member as a card -->
  <!-- https://ionicframework.com/docs/api/card -->
  <ion-card *ngFor="let member of crew" (click)="goToDetails(member.id)">
    <div style="display:flex; align-items:center; padding:8px;">

      <img [src]="getImageUrl(member.profile_path)"
           style="width:80px; height:100px; object-fit:cover; flex-shrink:0; border-radius:4px;">

      <ion-card-content style="padding: 0 0 0 12px;">
        <!-- crew members name and their job title -->
        <p style="margin:0; font-weight:bold; font-size:16px;">{{ member.name }}</p>
        <p style="margin:4px 0 0 0; font-size:14px; color:#555;">{{ member.job }}</p>
      </ion-card-content>

    </div>
  </ion-card>

</ion-content>
