<!-- home.page.html -->
<!-- Template for the home page using Ionic card components for a cleaner look -->
<!-- ion-card gives each movie a nice card style with shadow and rounded corners -->
<!-- https://ionicframework.com/docs/api/card -->
<!-- Flexbox reference: https://css-tricks.com/snippets/css/a-guide-to-flexbox/ -->

<ion-header>
  <ion-toolbar>
    <ion-title>G00485542</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="goToFavourites()">
        <ion-icon name="heart"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- search bar for typing in a movie name -->
  <!-- ngModel does two way binding so searchQuery updates as the user types -->
  <!-- https://angular.dev/guide/forms -->
  <ion-searchbar
    [(ngModel)]="searchQuery"
    placeholder="Search Movie Name">
  </ion-searchbar>

  <ion-button expand="full" (click)="search()" 
    style="--background: #CAD3C1; --color: #333; --border-radius: 30px; margin: 8px 16px;">
  SEARCH
</ion-button>

  <h2 style="padding: 10px 16px; font-size:18px; font-weight:bold;">{{ heading }}</h2>

  <!-- each movie displayed as an ion-card -->
  <!-- ion-card is an Ionic component that gives a nice card style layout -->
  <!-- https://ionicframework.com/docs/api/card -->
  <ion-card *ngFor="let movie of movies" (click)="goToMovieDetails(movie)">

    <div style="display:flex; align-items:flex-start; padding:8px;">

      <!-- movie poster on the left -->
      <img [src]="getImageUrl(movie.poster_path)"
           style="width:200x; height:300px; object-fit:cover; flex-shrink:0; border-radius:4px;">

      <ion-card-content style="padding:0 0 0 12px;">
        <!-- movie overview text truncated to 4 lines -->
        <p style="font-size:14px; color:#333; line-height:1.6; margin:0;
                  overflow:hidden; display:-webkit-box; -webkit-line-clamp:4;
                  -webkit-box-orient:vertical;">
          {{ movie.overview }}
        </p>
      </ion-card-content>

    </div>

  </ion-card>

</ion-content>
